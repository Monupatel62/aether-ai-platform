name: Repository manifest validation

on:
  pull_request:
    paths:
      - "docs/repository-manifest.json"
      - "docs/DEPENDENCY_MATRIX.md"
      - "docs/REPOSITORY_CATALOG.md"
      - ".github/scripts/validate_repository_manifest.py"
      - ".github/workflows/repository-manifest-validation.yml"
  push:
    branches: [main]
    paths:
      - "docs/repository-manifest.json"
      - "docs/DEPENDENCY_MATRIX.md"
      - "docs/REPOSITORY_CATALOG.md"
      - ".github/scripts/validate_repository_manifest.py"
      - ".github/workflows/repository-manifest-validation.yml"

permissions:
  contents: read

concurrency:
  group: repository-manifest-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository manifest
        run: python .github/scripts/validate_repository_manifest.py
