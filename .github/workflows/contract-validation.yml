name: Contract fixture validation

on:
  push:
    branches:
      - "docs/add-contract-validation-harness-2026-10-23"
    paths:
      - "docs/contracts/**"
      - "scripts/validate_contract_fixtures.py"
      - "requirements-contract-validation.txt"
      - ".github/workflows/contract-validation.yml"
  pull_request:
    paths:
      - "docs/contracts/**"
      - "scripts/validate_contract_fixtures.py"
      - "requirements-contract-validation.txt"
      - ".github/workflows/contract-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-json-schemas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract validator
        run: python -m pip install -r requirements-contract-validation.txt
      - name: Validate schemas and fixtures
        run: python scripts/validate_contract_fixtures.py
