name: OpenAPI 3.1 validation

on:
  push:
    branches:
      - "docs/add-openapi-validation-2026-10-23"
    paths:
      - "docs/contracts/openapi.v1.yaml"
      - "scripts/validate_openapi.py"
      - "requirements-openapi-validation.txt"
      - ".github/workflows/openapi-validation.yml"
  pull_request:
    paths:
      - "docs/contracts/openapi.v1.yaml"
      - "scripts/validate_openapi.py"
      - "requirements-openapi-validation.txt"
      - ".github/workflows/openapi-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install OpenAPI validator
        run: python -m pip install -r requirements-openapi-validation.txt
      - name: Validate OpenAPI 3.1 contract
        run: python scripts/validate_openapi.py
