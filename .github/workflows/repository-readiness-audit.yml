name: Repository readiness audit

on:
  pull_request:
    paths:
      - "scripts/repository_readiness_audit.py"
      - "tests/test_repository_readiness_audit.py"
      - ".github/workflows/repository-readiness-audit.yml"
  push:
    branches: [main]
    paths:
      - "scripts/repository_readiness_audit.py"
      - "tests/test_repository_readiness_audit.py"
      - ".github/workflows/repository-readiness-audit.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_repository_readiness_audit.py" -v
