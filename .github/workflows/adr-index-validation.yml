name: ADR index validation

on:
  pull_request:
    paths:
      - "docs/ADR_INDEX.md"
      - "docs/DECISION_LOG.md"
      - ".github/scripts/validate_adr_index.py"
      - ".github/workflows/adr-index-validation.yml"
  push:
    branches:
      - main
    paths:
      - "docs/ADR_INDEX.md"
      - "docs/DECISION_LOG.md"
      - ".github/scripts/validate_adr_index.py"
      - ".github/workflows/adr-index-validation.yml"

permissions:
  contents: read

concurrency:
  group: adr-index-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-adr-index:
    name: Validate canonical ADR index
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate ADR index
        run: python .github/scripts/validate_adr_index.py
